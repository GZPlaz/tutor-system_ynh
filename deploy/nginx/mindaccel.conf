# =============================================================================
# MindAccel — extra nginx rules for YunoHost "My Webapp" (instance 5)
#
# Installed by deploy/install.sh to:
#   /etc/nginx/conf.d/<DOMAIN>.d/my_webapp__5.d/mindaccel.conf
#
# My Webapp's own config includes every *.conf in that folder INSIDE its
# `location <PATH>/ { alias .../www/; ... }` block, so everything below is
# nested in it. My Webapp upgrades don't overwrite this file.
#
# __PATH__ and __PORT__ are substituted by install.sh (__PATH__ is "" when
# the app is installed at the domain root).
# =============================================================================

# 1) API → Node.js process on localhost (never exposed directly)
location __PATH__/api/ {
    proxy_pass         http://127.0.0.1:__PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Resource Hub uploads (keep >= UPLOAD_MAX_MB in .env)
    client_max_body_size 30M;
}

# 2) Single-page-app fallback. My Webapp ends try_files with "=404"; turn
#    that 404 into the SPA shell so deep links like /sessions work on reload.
#    (Upstream API 404s are unaffected: proxy_intercept_errors is off.)
error_page 404 =200 __PATH__/index.html;
