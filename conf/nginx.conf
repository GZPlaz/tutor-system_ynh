#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    # The whole site (web app + API) is served by the Node service; nginx only forwards.
    # The trailing slash in proxy_pass strips the install path, so the app always sees "/api/..." and "/".
    proxy_pass http://127.0.0.1:__PORT__/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Resource Hub uploads (UPLOAD_MAX_MB defaults to 25) plus form overhead.
    client_max_body_size 30M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
